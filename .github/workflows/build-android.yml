name: Build Android app
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'agent/**'
      - 'tests/**'
      - '.github/workflows/github-vpn-session.yml'
      - '.github/workflows/build-android.yml'
permissions:
  contents: read
jobs:
  build:
    # This runner includes Android SDK 35 and its build tools; avoid reinstalling the SDK.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: |
          : "${ANDROID_HOME:?GitHub runner did not provide ANDROID_HOME}"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check OAuth app configuration
        id: oauth
        env:
          CLIENT_ID: ${{ vars.CLOUDPATH_GITHUB_CLIENT_ID }}
        run: |
          if [[ -z "$CLIENT_ID" ]]; then
            echo 'artifact_suffix=-unconfigured' >> "$GITHUB_OUTPUT"
            echo '::warning title=OAuth not configured::Fresh installs of this developer APK cannot sign in. Configure the public CLOUDPATH_GITHUB_CLIENT_ID repository variable and rebuild before distributing it.'
            echo '⚠️ OAuth is not configured. Fresh installs cannot sign in; set the public repository variable and rebuild.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$CLIENT_ID" =~ ^[A-Za-z0-9_.-]{8,100}$ ]]; then
            echo 'artifact_suffix=' >> "$GITHUB_OUTPUT"
            echo 'A public OAuth Client ID was supplied for this APK. Actual GitHub authorization still needs testing.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::error title=Invalid OAuth configuration::CLOUDPATH_GITHUB_CLIENT_ID is not a valid public Client ID.'
            exit 1
          fi
      - name: Test tunnel agent
        run: node --test tests/*.test.mjs
      - name: Fetch pinned native dependencies
        run: android/scripts/fetch-native.sh
      - name: Run unit tests and build debug APK
        working-directory: android
        env:
          # Public OAuth App client ID, shared by all users of this APK. Never use a client secret.
          CLOUDPATH_GITHUB_CLIENT_ID: ${{ vars.CLOUDPATH_GITHUB_CLIENT_ID }}
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cloudpath-vpn-debug${{ steps.oauth.outputs.artifact_suffix }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  diagnostics:
    # Surface a concise, redacted reason when a GitHub-hosted build fails.
    needs: build
    if: ${{ failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Summarize failed build
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY/actions"
          job_id=$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' "$api/runs/$RUN_ID/jobs?per_page=100" \
            | jq -r '.jobs[] | select(.name == "build") | .id' | head -n1)
          test -n "$job_id"
          curl --fail --silent --show-error --location --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$api/jobs/$job_id/logs" -o "$RUNNER_TEMP/failed-build.log"
          python3 - "$RUNNER_TEMP/failed-build.log" <<'PY'
          import re, sys
          lines = open(sys.argv[1], encoding='utf-8', errors='replace').read().splitlines()
          clean = [re.sub(r'\x1b\[[0-9;]*m', '', re.sub(r'^\S+Z\s+', '', line)).strip() for line in lines]
          indices = set()
          for i, text in enumerate(clean):
              if re.search(r'(?i)(##\[error\]|\berror\b|\bexception\b|\bfail(?:ed|ure)\b|could not|what went wrong|caution:)', text):
                  indices.update(range(max(0, i - 6), min(len(clean), i + 5)))
          relevant = [clean[i][:500] for i in sorted(indices) if clean[i] and not
                      re.search(r'(?i)(token|password|secret|authorization)', clean[i])]
          message = '\n'.join(relevant[-24:])[-3500:] or 'Build failed; open the GitHub job log for details.'
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::warning title=Build failure details::' + message)
          PY
