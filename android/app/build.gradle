plugins { id 'com.android.application' }

android {
    namespace 'app.cloudpath.githubvpn'
    compileSdk 35

    defaultConfig {
        applicationId 'app.cloudpath.githubvpn'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildTypes {
        release { minifyEnabled false }
    }
    packaging { resources { excludes += ['META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/versions/**'] } }
}

dependencies {
    // Native libraries are fetched by scripts/fetch-native.sh, pinned by SHA-256.
    implementation files('libs/libXray.aar', 'libs/hev-socks5-tunnel.aar')
    implementation 'org.bouncycastle:bcprov-jdk18on:1.80'
    testImplementation 'junit:junit:4.13.2'
}

dependencies {
    // Android's org.json methods are stubs in local JVM tests.
    testImplementation 'org.json:json:20240303'
}
